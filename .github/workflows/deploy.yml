name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source tarball
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./.claude' \
              --exclude='./post-linkedin-*.md' \
              --exclude='./deploy/server-compose.yml' \
              --exclude='./deploy/friendlyflights.caddy' \
              -czf "${RUNNER_TEMP}/src.tar.gz" .

      - name: Setup SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.HETZNER_SSH_KEY }}

      - name: Trust host key
        run: ssh-keyscan -H 167.233.99.156 >> ~/.ssh/known_hosts

      - name: Upload tarball + deploy files
        run: |
          scp "${RUNNER_TEMP}/src.tar.gz" root@167.233.99.156:/opt/friendlyflights/src.tar.gz
          scp deploy/server-compose.yml root@167.233.99.156:/opt/friendlyflights/docker-compose.yml
          scp deploy/build-on-server.sh root@167.233.99.156:/opt/friendlyflights/build-on-server.sh
          scp deploy/friendlyflights.caddy root@167.233.99.156:/opt/tilestudio/sites/friendlyflights.caddy

      - name: Build image and restart container
        run: |
          ssh root@167.233.99.156 \
            'chmod +x /opt/friendlyflights/build-on-server.sh && /opt/friendlyflights/build-on-server.sh'

      - name: Reload Caddy
        run: |
          ssh root@167.233.99.156 \
            'docker exec tilestudio-caddy-1 caddy reload --config /etc/caddy/Caddyfile'
