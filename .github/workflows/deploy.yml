name: Deploy to Hetzner

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build source tarball
        run: |
          tar --exclude='.git' \
              --exclude='.github' \
              --exclude='node_modules' \
              --exclude='.claude' \
              --exclude='post-linkedin-*.md' \
              --exclude='deploy/server-compose.yml' \
              --exclude='deploy/friendlyflights.caddy' \
              -czf src.tar.gz .

      - name: Setup SSH
        env:
          SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 167.233.99.156 >> ~/.ssh/known_hosts

      - name: Upload tarball + deploy files
        run: |
          scp -i ~/.ssh/id_ed25519 src.tar.gz root@167.233.99.156:/opt/friendlyflights/src.tar.gz
          scp -i ~/.ssh/id_ed25519 deploy/server-compose.yml root@167.233.99.156:/opt/friendlyflights/docker-compose.yml
          scp -i ~/.ssh/id_ed25519 deploy/build-on-server.sh root@167.233.99.156:/opt/friendlyflights/build-on-server.sh
          scp -i ~/.ssh/id_ed25519 deploy/friendlyflights.caddy root@167.233.99.156:/opt/tilestudio/sites/friendlyflights.caddy

      - name: Build image and restart container
        run: |
          ssh -i ~/.ssh/id_ed25519 root@167.233.99.156 \
            'chmod +x /opt/friendlyflights/build-on-server.sh && /opt/friendlyflights/build-on-server.sh'

      - name: Reload Caddy
        run: |
          ssh -i ~/.ssh/id_ed25519 root@167.233.99.156 \
            'docker exec tilestudio-caddy-1 caddy reload --config /etc/caddy/Caddyfile'
