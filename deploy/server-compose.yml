name: friendlyflights

services:
  app:
    image: friendlyflights:latest
    container_name: friendlyflights-app
    restart: unless-stopped
    environment:
      PORT: "3001"
      PYTHON_BIN: python3
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3001/api/airports', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    networks:
      - tilestudio_default

networks:
  tilestudio_default:
    external: true
