# Fly.io config for FriendlyFlights.
# Generated for shared-cpu-1x@1024MB with full auto-stop to keep costs minimal
# (the machine shuts down when idle and wakes up in 1-3 s on the next request).
#
# Deploy from your machine: `flyctl deploy`
# Deploy from CI:           the GitHub Actions workflow in .github/workflows/

app            = "friendlyflights"
primary_region = "mad"            # Madrid — closest to most of our users

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV   = "production"
  PYTHON_BIN = "python3"

[http_service]
  internal_port       = 3001
  force_https         = true
  auto_stop_machines  = "stop"     # turn off when idle → costs ~$0/mo
  auto_start_machines = true       # wake on incoming request
  min_machines_running = 0

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 50
    soft_limit = 25

  # Liveness check — `/` serves index.html so this is a free smoke test
  [[http_service.checks]]
    grace_period = "30s"
    interval     = "30s"
    method       = "GET"
    timeout      = "5s"
    path         = "/"

[[vm]]
  cpu_kind  = "shared"
  cpus      = 1
  memory_mb = 1024
